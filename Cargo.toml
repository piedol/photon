[package]
name = "photon"
version = "0.2.0"
edition = "2024"
description = "Screenshot, markup and screen recording for Apple silicon Macs"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "Photon"
path = "src/main.rs"

[dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["block2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-media = "0.3.2"
objc2-service-management = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-av-kit = { version = "0.3.2", features = ["block2", "objc2-core-media", "objc2-core-foundation"] }
objc2-image-io = { version = "0.3.2", features = ["objc2-core-graphics"] }
block2 = "0.6.2"
libc = "0.2"
dispatch2 = "0.3.1"
global-hotkey = "0.9.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
